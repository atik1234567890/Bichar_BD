services:
  - type: web
    name: bichar-bd-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=4 --timeout=120 app:app
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SKIP_HEAVY_INIT
        value: 1
